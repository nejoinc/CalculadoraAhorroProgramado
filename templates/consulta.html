<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Ahorro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-primary {
            background-color: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background-color: #5568d3;
        }

        .btn-secondary {
            background-color: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
        }

        .btn-secondary:hover {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Consulta de Ahorro</h1>
        
        <form id="consultaForm">
            <div class="form-group">
                <label for="usuarioId">ID de Usuario</label>
                <input 
                    type="text" 
                    id="usuarioId" 
                    name="usuarioId" 
                    placeholder="Ingrese su ID de usuario"
                    required
                >
            </div>

            <div class="form-group">
                <label for="tipoConsulta">Tipo de Consulta</label>
                <select id="tipoConsulta" name="tipoConsulta" required>
                    <option value="">Seleccione una opción</option>
                    <option value="total">Ahorro Total</option>
                    <option value="mensual">Ahorro Mensual</option>
                    <option value="meta">Progreso de Meta</option>
                </select>
            </div>

            <div class="form-group">
                <label for="fechaInicio">Fecha de Inicio (Opcional)</label>
                <input 
                    type="text" 
                    id="fechaInicio" 
                    name="fechaInicio" 
                    placeholder="DD/MM/YYYY"
                >
            </div>

            <div class="button-group">
                <button type="submit" class="btn-primary">Buscar</button>
                <button type="reset" class="btn-secondary">Limpiar</button>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('consultaForm').addEventListener('submit', function(event) {
            event.preventDefault();
            console.log('Formulario enviado');
            // Aquí irá la lógica para enviar los datos
        });
    </script>
</body>
</html>
