<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado de Ahorro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 8px 8px 0 0;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 0;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #888;
            font-size: 14px;
        }

        .results {
            background: white;
            padding: 30px;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .info-card {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        .info-card h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .info-card p {
            color: #555;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .valor {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-top: 10px;
        }

        .progress-container {
            margin: 30px 0;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: #555;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 65%;
            border-radius: 5px;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background-color: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background-color: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background-color: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background-color: #e0e0e0;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Resultado de Ahorro</h1>
            <p>Usuario: <strong>USR-001</strong></p>
        </div>

        <div class="results">
            <!-- Resumen de Ahorro Total -->
            <div class="info-card">
                <h3>Ahorro Total</h3>
                <p>Monto acumulado hasta la fecha</p>
                <div class="valor">$12,500.00</div>
            </div>

            <!-- Meta de Ahorro -->
            <div class="info-card">
                <h3>Meta de Ahorro</h3>
                <p>Objetivo establecido</p>
                <div class="valor">$20,000.00</div>
            </div>

            <!-- Progreso -->
            <div class="progress-container">
                <div class="progress-label">
                    <span>Progreso de Meta</span>
                    <span><strong>62.5%</strong></span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 62.5%;"></div>
                </div>
            </div>

            <!-- Información Adicional -->
            <div class="info-card">
                <h3>Información Adicional</h3>
                <p><strong>Ahorro Mensual Promedio:</strong> $1,250.00</p>
                <p><strong>Meses de Aporte:</strong> 10</p>
                <p><strong>Próximo Depósito:</strong> 15/06/2026</p>
            </div>

            <!-- Botones de Acción -->
            <div class="action-buttons">
                <button class="btn-primary">Descargar Reporte</button>
                <button class="btn-secondary">Nueva Consulta</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Página de resultados cargada');
        });
    </script>
</body>
</html>
