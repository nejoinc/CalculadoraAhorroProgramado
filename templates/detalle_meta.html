<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Meta</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .details-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
        }

        .detail-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .detail-item {
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .detail-label {
            color: #999;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .detail-value {
            color: #333;
            font-size: 24px;
            font-weight: 600;
        }

        .detail-value.currency {
            color: #667eea;
        }

        .detail-value.number {
            color: #764ba2;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 40px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            text-align: center;
        }

        .btn-primary {
            background-color: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background-color: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background-color: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background-color: #e0e0e0;
        }

        .info-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .detail-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💡 Detalle de Meta</h1>
            <p>Información de tu plan de ahorro</p>
        </div>

        <div class="details-container">
            <span class="info-badge">Meta #{{ meta.id_meta }}</span>

            <div class="detail-row">
                <div class="detail-item">
                    <div class="detail-label">Monto Meta</div>
                    <div class="detail-value currency">${{ meta.meta }}</div>
                </div>

                <div class="detail-item">
                    <div class="detail-label">Plazo</div>
                    <div class="detail-value number">{{ meta.plazo }} meses</div>
                </div>
            </div>

            <div class="detail-row">
                <div class="detail-item">
                    <div class="detail-label">Monto Extra</div>
                    <div class="detail-value currency">${{ meta.extra }}</div>
                </div>

                <div class="detail-item">
                    <div class="detail-label">Mes del Extra</div>
                    <div class="detail-value number">{{ meta.mes_extra }}</div>
                </div>
            </div>

            <div class="detail-row full-width">
                <div class="detail-item">
                    <div class="detail-label">ID Usuario</div>
                    <div class="detail-value number">#{{ meta.id_usuario }}</div>
                </div>
            </div>

            <div class="button-group">
                <a href="/" class="btn btn-primary">Crear Nueva Meta</a>
                <a href="/" class="btn btn-secondary">Volver</a>
            </div>
        </div>
    </div>
</body>
</html>
